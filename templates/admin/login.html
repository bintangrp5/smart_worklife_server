<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart-WorkLife | Admin Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f0c29 0%,#302b63 50%,#24243e 100%);overflow:hidden;position:relative}
.blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.25;animation:float 8s ease-in-out infinite}
.b1{width:420px;height:420px;background:#4F46E5;top:-120px;left:-120px}
.b2{width:320px;height:320px;background:#7C3AED;bottom:-100px;right:-60px;animation-delay:3s}
.b3{width:220px;height:220px;background:#2563EB;top:50%;right:18%;animation-delay:5s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(20px,-20px) scale(1.05)}66%{transform:translate(-20px,20px) scale(.95)}}
.wrap{position:relative;z-index:10;width:100%;max-width:440px;padding:20px}
.card{background:rgba(255,255,255,.05);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:48px 40px;box-shadow:0 25px 50px rgba(0,0,0,.5)}
.logo{text-align:center;margin-bottom:32px}
.logo-icon{width:72px;height:72px;background:linear-gradient(135deg,#4F46E5,#7C3AED);border-radius:20px;display:inline-flex;align-items:center;justify-content:center;font-size:34px;margin-bottom:14px;box-shadow:0 8px 32px rgba(79,70,229,.4)}
.logo h1{font-size:22px;font-weight:700;color:#f8fafc;letter-spacing:-.5px}
.logo p{font-size:12px;color:rgba(255,255,255,.45);margin-top:4px}
.badge{display:inline-flex;align-items:center;gap:5px;background:rgba(79,70,229,.2);border:1px solid rgba(79,70,229,.4);border-radius:20px;padding:3px 12px;font-size:11px;color:#818CF8;font-weight:500;margin-top:8px}
h2{font-size:18px;font-weight:600;color:#f1f5f9;margin-bottom:6px}
.sub{font-size:13px;color:rgba(255,255,255,.35);margin-bottom:24px}
.form-group{margin-bottom:14px}
label{display:block;font-size:12px;font-weight:500;color:rgba(255,255,255,.6);margin-bottom:7px}
input{width:100%;padding:12px 16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;color:#f8fafc;font-size:14px;font-family:'Inter',sans-serif;outline:none;transition:all .2s}
input:focus{border-color:#4F46E5;background:rgba(79,70,229,.1);box-shadow:0 0 0 3px rgba(79,70,229,.2)}
input::placeholder{color:rgba(255,255,255,.2)}
.btn{width:100%;padding:13px;background:linear-gradient(135deg,#4F46E5,#7C3AED);border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;margin-top:6px;transition:all .3s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(79,70,229,.5)}
.btn:active{transform:translateY(0)}
.btn.loading{opacity:.7;pointer-events:none}
.err{display:none;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:10px;padding:10px 14px;color:#FCA5A5;font-size:13px;margin-bottom:14px}
.div{display:flex;align-items:center;gap:12px;margin:22px 0 14px}
.div hr{flex:1;border:none;border-top:1px solid rgba(255,255,255,.1)}
.div span{color:rgba(255,255,255,.25);font-size:12px}
.link{display:flex;align-items:center;justify-content:center;gap:8px;color:rgba(255,255,255,.35);font-size:13px;text-decoration:none;transition:color .2s;padding:8px}
.link:hover{color:#818CF8}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<div class="wrap">
  <div class="card">
    <div class="logo">
      <div class="logo-icon">🚀</div>
      <h1>Smart-WorkLife</h1>
      <p>Developer Operations Center</p>
      <div class="badge">🔐 ADMIN ONLY</div>
    </div>
    <h2>Selamat Datang</h2>
    <p class="sub">Login dengan kredensial developer Anda</p>
    <div class="err" id="err">❌ Email atau password salah.</div>
    <form onsubmit="doLogin(event)">
      <div class="form-group">
        <label>📧 Email Developer</label>
        <input type="email" id="em" placeholder="admin@smartworklife.com" required>
      </div>
      <div class="form-group">
        <label>🔑 Password</label>
        <input type="password" id="pw" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn" id="btn">Masuk ke Dashboard →</button>
    </form>
    <div class="div"><hr><span>atau</span><hr></div>
    <a href="/docs" class="link">📋 Lihat API Documentation (Swagger)</a>
  </div>
</div>
<script>
async function doLogin(e){
  e.preventDefault();
  const btn=document.getElementById('btn'),err=document.getElementById('err');
  btn.classList.add('loading');btn.textContent='Memverifikasi...';err.style.display='none';
  const fd=new FormData();
  fd.append('email',document.getElementById('em').value);
  fd.append('password',document.getElementById('pw').value);
  try{
    const r=await fetch('/admin/login',{method:'POST',body:fd});
    if(r.ok){btn.textContent='✓ Berhasil!';setTimeout(()=>location.href='/admin/dashboard',500);}
    else{err.style.display='block';btn.classList.remove('loading');btn.textContent='Masuk ke Dashboard →';}
  }catch{err.style.display='block';btn.classList.remove('loading');btn.textContent='Masuk ke Dashboard →';}
}
</script>
</body>
</html>
